<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Home</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-white box-border m-0 p-0 font-[Montserrat]">
    <header></header>
    <main>
      <section class="hero"></section>
      <section class="search-bar"></section>
      <section class="our mission"></section>
      <section class="why-us"></section>
      <section class="offerings"></section>
      <section class="reviews"></section>
      <section class="contact-us"></section>
    </main>
    <!-- /////////////////////FOOTER////////////////////////////////////
    ////////////////////////////////////////////////////////////// -->
    <footer
      class="bg-[#DDC7BB] w-full h-70 flex justify-evenly items-start p-1"
    >
      <!-- /////////////////////logo////////////////////////////////////
    ////////////////////////////////////////////////////////////// -->
      <div class="footer-logo border-2 w-[15%] py-5 border-red-600">
        <figure class="w-15">
          <img src="./src/assets/Logo-orig-75smaller.png" alt="logo" />
        </figure>
        <p>Making your dream home come true is our passion.</p>
      </div>
      <!-- /////////////////////ABOUT////////////////////////////////////
    ////////////////////////////////////////////////////////////// -->
      <div class="footer-about py-5 border-2 border-red-600">
        <h4 class="font-bold">About</h4>
        <ul>
          <li><a href="#">Our Story</a></li>
          <li><a href="#">Careers</a></li>
          <li><a href="#">Our Team</a></li>
          <li><a href="#">Resources</a></li>
        </ul>
      </div>
      <!-- /////////////////////SUPPORT////////////////////////////////////
    ////////////////////////////////////////////////////////////// -->
      <div class="footer-support py-5 border-2 border-red-600">
        <h4 class="font-bold">Support</h4>
        <ul>
          <li><a href="#">FAQ</a></li>
          <li><a href="#">Contact Us</a></li>
          <li><a href="#">Help Center</a></li>
          <li><a href="#">Terms of Service</a></li>
        </ul>
      </div>
      <!-- /////////////////////FIND////////////////////////////////////
    ////////////////////////////////////////////////////////////// -->
      <div class="footer-find py-5 border-2 border-red-600">
        <h4 class="font-bold">Find Us</h4>
        <ul>
          <li><a href="#">Events</a></li>
          <li><a href="#">Locations</a></li>
          <li><a href="#">Newsletter</a></li>
        </ul>
      </div>
      <!-- /////////////////////SOCIAL////////////////////////////////////
    ////////////////////////////////////////////////////////////// -->
      <div class="footer-social py-5 border-2 border-red-600">
        <h4 class="font-bold">Our Social</h4>
        <ul>
          <li><a href="#">instgram</a></li>
          <li><a href="#">facebook</a></li>
          <li><a href="#">Twitter</a></li>
        </ul>
      </div>
    </footer>
  </body>
</html>
